<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fd267d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>StallionSwipe 🐴 — Tinder for Horses</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink:#fd267d; --orange:#ff7854; --green:#4ce600; --red:#ff2f2f;
    --surface:#fff6f4;      /* warm blush panels instead of stark white */
    --surface-2:#fbe9e6;    /* slightly deeper blush for the app bg */
    --bubble:#fff9f8;       /* incoming chat bubble */
    --line:#f3dcd8;         /* soft warm borders */
  }
  html, body { height: 100vh; height: 100dvh; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--orange) 0%, var(--pink) 100%);
    display: flex; align-items: center; justify-content: center; color: #fff;
    overflow: hidden;   /* the app scrolls internally, not the page */
  }
  #phone {
    width: 100%; height: 100%;
    background: #1c1c1e; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  /* On big screens, show it as a centered "phone" mockup instead of full-bleed */
  @media (min-width: 640px) {
    #phone {
      max-width: 420px; height: 100vh; height: 100dvh;
      box-shadow: 0 0 60px rgba(0,0,0,.4);
    }
  }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--surface); color: var(--pink);
    border-bottom: 1px solid #eee; flex-shrink: 0;
  }
  header .logo { font-weight: 800; font-size: 1.25rem; }
  header .nav { display: flex; gap: 8px; }
  header .nav button {
    background: none; border: none; cursor: pointer; color: var(--pink);
    opacity: .45; transition: opacity .15s, background .15s; position: relative;
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  header .nav button:hover { opacity: .8; }
  header .nav button.active { opacity: 1; background: #fde3ee; }
  header .nav button .badge {
    position: absolute; top: -4px; right: -8px; background: var(--red); color: #fff;
    font-size: .6rem; font-weight: 700; border-radius: 999px; padding: 1px 5px;
  }
  header .nav button .badge.pulse { animation: badgePulse .6s ease 2; }
  @keyframes badgePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }

  main { flex: 1; overflow: hidden; position: relative; background: var(--surface-2); }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---- onboarding ---- */
  #screen-onboard { background: var(--surface); color: #4a3f3d; padding: 30px 26px; overflow-y: auto; }
  #screen-onboard h2 { color: var(--pink); margin-bottom: 4px; }
  #screen-onboard p.sub { color: #888; font-size: .9rem; margin-bottom: 22px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: .8rem; font-weight: 700; color: #555; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: .95rem; background: #fff; color: #4a3f3d;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
    font-size: .85rem; user-select: none; transition: all .12s;
  }
  .chip.on { background: var(--pink); color: #fff; border-color: var(--pink); }
  .primary-btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px; margin-top: 10px;
    background: var(--pink); color: #fff;
    font-weight: 700; font-size: 1rem; cursor: pointer; transition: background .12s;
  }
  .primary-btn:hover { background: #e01f6c; }

  /* ---- swipe deck ---- */
  #deck { position: relative; flex: 1; margin: 16px; }
  .card {
    position: absolute; inset: 0; background: var(--surface); border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25); color: #333; overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .35s ease, opacity .35s ease; cursor: grab; user-select: none;
  }
  .card .photo {
    flex: 1; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #ffe3ec, #ffd6a5);
  }
  .card .photo svg { width: 100%; height: 100%; display: block; object-fit: cover; }
  .card .verified { position: absolute; top: 12px; left: 12px; font-size: 1.1rem;
    background: #2196f3; color: #fff; border-radius: 999px; padding: 2px 9px; font-weight: 700; }
  .card .info { padding: 14px 18px 18px; }
  .card .info h2 { font-size: 1.35rem; }
  .card .info h2 span { font-weight: 400; color: #888; font-size: 1.05rem; }
  .card .meta { color: #666; font-size: .82rem; margin: 4px 0 8px; }
  .card .status { font-size: .78rem; font-weight: 600; margin: 2px 0 6px; display: flex; align-items: center; gap: 6px; }
  .card .status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .card .status.on { color: #2fae4e; } .card .status.on .dot { background: #2fae4e; box-shadow: 0 0 0 3px #2fae4e33; }
  .card .status.off { color: #999; } .card .status.off .dot { background: #bbb; }
  .card.online { box-shadow: 0 0 0 3px #2fae4e, 0 12px 30px rgba(0,0,0,.25); }
  .match-row .av.av-online { box-shadow: 0 0 0 2px #2fae4e; }
  .mini-on { color: #2fae4e; font-weight: 600; }
  .card .bio { font-size: .88rem; color: #444; line-height: 1.35; }
  .card .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags span { background: #fd267d22; color: var(--pink);
    padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
  .card .score { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.55);
    color: #fff; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
  .card .likesyou { position: absolute; top: 46px; right: 14px; background: #2196f3;
    color: #fff; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .likeback { margin-left: auto; display: flex; gap: 8px; }
  .likeback button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid; cursor: pointer;
    font-size: 1rem; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .likeback .lb-nope { color: var(--red); background: transparent; border-color: var(--red); }
  .likeback .lb-yes { color: #fff; background: var(--pink); border-color: var(--pink); }
  .stamp { position: absolute; top: 26px; font-size: 1.8rem; font-weight: 900;
    padding: 6px 14px; border: 4px solid; border-radius: 12px; opacity: 0;
    transition: opacity .1s; text-transform: uppercase; z-index: 3; }
  .stamp.like { left: 20px; color: var(--green); border-color: var(--green); transform: rotate(-18deg); }
  .stamp.nope { right: 20px; color: var(--red); border-color: var(--red); transform: rotate(18deg); }
  .card.gone-left  { transform: translateX(-160%) rotate(-24deg); opacity: 0; }
  .card.gone-right { transform: translateX(160%)  rotate(24deg);  opacity: 0; }
  .card.gone-up    { transform: translateY(-160%) rotate(6deg);   opacity: 0; }
  .card.rewind-in  { animation: rewindIn .38s ease; }
  @keyframes rewindIn {
    from { transform: translateY(-160%) rotate(-6deg); opacity: 0; }
    to   { transform: translateY(0) rotate(0); opacity: 1; }
  }

  #controls { display: flex; gap: 22px; justify-content: center; padding: 4px 0 20px; }
  #controls button, #controls a {
    width: 56px; height: 56px; border-radius: 50%; font-size: 1.4rem;
    cursor: pointer; background: transparent; transition: background .12s, color .12s;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  #controls button:active, #controls a:active { transform: scale(.92); }
  #about-btn { color: #9a8f8c; border: 2px solid #9a8f8c; text-decoration: none; }
  #about-btn:hover { background: #9a8f8c; color: #fff; }
  #rewind-btn { color: #ffb300; border: 2px solid #ffb300; }
  #rewind-btn:hover { background: #ffb300; color: #fff; }
  #nope-btn { color: var(--red); border: 2px solid var(--red); }
  #nope-btn:hover { background: var(--red); color: #fff; }
  #like-btn { color: var(--pink); border: 2px solid var(--pink); }
  #like-btn:hover { background: var(--pink); color: #fff; }
  #like-btn.glow { background: var(--pink); color: #fff; transform: scale(1.15); }
  #nope-btn.glow { background: var(--red); color: #fff; transform: scale(1.15); }

  #empty { display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; height: 100%; color: #777; padding: 40px; }
  #empty h2 { margin-bottom: 8px; color: #444; }

  /* ---- matches / chat lists ---- */
  .list { flex: 1; overflow-y: auto; padding: 8px; color: #333; }
  .list h3 { padding: 10px 12px 6px; color: #888; font-size: .8rem; text-transform: uppercase; }
  .match-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    background: var(--surface); border-radius: 14px; margin: 6px 4px; cursor: pointer; }
  .match-row:active { background: #f7f7f7; }
  .match-row .av { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, #ffe3ec, #ffd6a5); display: flex; align-items: center; justify-content: center; }
  .match-row .av svg { width: 100%; height: 100%; }
  #chat-head .av svg { width: 100%; height: 100%; }
  .match-row .who { font-weight: 700; }
  .match-row .last { color: #999; font-size: .82rem; }
  .match-row .pct { margin-left: auto; color: var(--pink); font-weight: 700; font-size: .85rem; }
  .empty-note { text-align: center; color: #999; padding: 40px 20px; }

  /* ---- chat ---- */
  #screen-chat { background: var(--surface-2); color: #4a3f3d; }
  #chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  #chat-head .av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-block; }
  #chat-head .back { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--pink); }
  #chat-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: .92rem; line-height: 1.3; }
  .bubble.them { background: var(--bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .chat-head-txt { display: flex; flex-direction: column; line-height: 1.15; }
  .chat-status { font-size: .72rem; font-weight: 600; }
  .chat-status.on { color: #2fae4e; }
  .chat-status.off { color: #999; }
  .receipt { font-size: .68rem; color: #aaa; align-self: flex-end; margin: -4px 2px 2px; }
  .bubble.typing { display: flex; gap: 4px; padding: 12px 14px; }
  .bubble.typing span { width: 7px; height: 7px; border-radius: 50%; background: #bbb; animation: blink 1.2s infinite; }
  .bubble.typing span:nth-child(2) { animation-delay: .2s; }
  .bubble.typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
  .bubble.me { background: linear-gradient(135deg, var(--orange), var(--pink)); color: #fff;
    align-self: flex-end; border-bottom-right-radius: 4px; }
  #chat-input { display: flex; gap: 8px; padding: 10px; background: var(--surface); border-top: 1px solid var(--line); }
  #chat-input input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  #chat-input button { border: none; background: var(--pink); color: #fff; border-radius: 50%;
    width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; }

  /* ---- filters ---- */
  #screen-filters { background: var(--surface); color: #4a3f3d; padding: 24px; overflow-y: auto; }
  #screen-filters h2 { color: var(--pink); margin-bottom: 18px; }
  .range-val { float: right; color: var(--pink); font-weight: 700; }
  /* simple native sliders + checkboxes, recolored to the app's pink */
  #screen-filters input[type="range"] { accent-color: var(--pink); width: 100%; margin: 10px 0; }
  #screen-filters input[type="checkbox"] { accent-color: var(--pink); width: 16px; height: 16px; vertical-align: -2px; margin-right: 6px; }
  #screen-filters .about-link { display: block; text-align: center; margin-top: 20px; padding: 10px;
    color: var(--pink); font-size: 1rem; font-weight: 700;
    text-decoration: underline; text-underline-offset: 3px; }
  #screen-filters .about-link:hover { color: #e01f6c; }
  /* ---- match modal ---- */
  #match-modal { position: absolute; inset: 0; background: rgba(0,0,0,.75);
    display: none; align-items: center; justify-content: center; z-index: 20; }
  #match-modal .inner { text-align: center; animation: pop .4s ease; padding: 20px; }
  #match-modal h2 { font-size: 2.4rem; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #match-modal .emojis { font-size: 3.6rem; margin: 10px 0; }
  #match-modal .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  #match-modal button { padding: 12px 24px; border: none; border-radius: 10px; font-weight: 700;
    cursor: pointer; font-size: .95rem; }
  #match-modal .say { background: #fff; color: var(--pink); }
  #match-modal .keep { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confetti { position: absolute; top: -30px; z-index: 25; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall {
    from { transform: translateY(0) rotate(0); opacity: 1; }
    to   { transform: translateY(120vh) rotate(540deg); opacity: 0; }
  }
  .info-btn { background: var(--pink); border: none; color: #fff; cursor: pointer; float: right;
    font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 5px 12px; }
  .info-btn:active { transform: scale(.94); }
  #profile-modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 22;
    display: none; align-items: center; justify-content: center; padding: 20px; }
  #profile-modal.open { display: flex; }
  .profile-card { background: var(--surface); color: #4a3f3d; border-radius: 20px; width: 100%; max-width: 330px;
    max-height: 90%; overflow-y: auto; animation: pop .3s ease; }
  .profile-card .p-gallery-wrap { position: relative; }
  .profile-card .p-gallery { height: 240px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    cursor: grab;
    border-radius: 20px 20px 0 0; scrollbar-width: none; }
  .profile-card .p-gallery::-webkit-scrollbar { display: none; }
  .profile-card .p-slide { flex: 0 0 100%; scroll-snap-align: start; overflow: hidden; }
  .profile-card .p-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0,0,0,.35); color: #fff; font-size: 1.3rem; line-height: 1;
    display: flex; align-items: center; justify-content: center; }
  .profile-card .p-nav.prev { left: 8px; }
  .profile-card .p-nav.next { right: 8px; }
  .profile-card .p-slide svg { width: 100%; height: 100%; display: block; }
  .profile-card .p-dots { display: flex; gap: 6px; justify-content: center; padding: 8px 0 2px; }
  .profile-card .p-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .15s; }
  .profile-card .p-dots span.on { background: var(--pink); }
  .profile-card .p-body { padding: 16px 18px 20px; }
  .profile-card h2 { font-size: 1.5rem; }
  .profile-card h2 span { color: #888; font-weight: 400; }
  .profile-card .p-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; color: #555;
    font-size: .85rem; margin: 8px 0 12px; }
  .profile-card .p-bio { font-size: .92rem; line-height: 1.4; margin-bottom: 12px; }
  .profile-card .prompt { background: #faf6f2; border-left: 3px solid var(--pink);
    padding: 8px 12px; border-radius: 8px; margin: 8px 0; font-size: .88rem; }
  .profile-card .prompt b { display: block; color: var(--pink); font-size: .74rem; text-transform: uppercase; margin-bottom: 2px; }
  .profile-card .p-close { width: 100%; padding: 12px; border: none; background: #f0f0f0;
    color: #555; font-weight: 700; border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 8px 16px; border-radius: 999px;
    font-size: .85rem; opacity: 0; transition: opacity .3s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="phone">
  <header>
    <div class="logo">🐴 StallionSwipe</div>
    <div class="nav" id="nav" style="display:none">
      <button data-go="swipe" class="active" title="Swipe"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-1.5.6-2.7 1.4-3.6C9 10 9.5 11 10 11.5 10 9 11 5 12 3Z"/></svg></button>
      <button data-go="liked" title="Liked You"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 4.5 12.5a4.5 4.5 0 0 1 6.4-6.3l1.1 1 1.1-1a4.5 4.5 0 0 1 6.4 6.3Z"/></svg><span class="badge" id="liked-badge" style="display:none">0</span></button>
      <button data-go="matches" title="Matches"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.3 7.3L4 20l.7-5.7A8 8 0 1 1 21 12Z"/></svg><span class="badge" id="match-badge" style="display:none">0</span></button>
      <button data-go="filters" title="Filters"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="8" cy="18" r="2" fill="#fff"/></svg></button>
    </div>
  </header>

  <main>
    <!-- ONBOARDING -->
    <section class="screen active" id="screen-onboard">
      <h2>Create your profile</h2>
      <p class="sub">Tell us about your horse so we can find their perfect stable-mate.</p>
      <div class="field"><label>Name</label><input id="ob-name" placeholder="e.g. Bella" value="Neigh-oncé"></div>
      <div class="field"><label>Age (years)</label><input id="ob-age" type="number" value="5" min="1" max="40"></div>
      <div class="field"><label>Height (hands)</label><input id="ob-height" type="number" step="0.1" value="15.0"></div>
      <div class="field"><label>Temperament</label>
        <select id="ob-temp"><option>playful</option><option>chill</option><option>spirited</option><option>stoic</option></select>
      </div>
      <div class="field"><label>Disciplines (pick a few)</label>
        <div class="chip-row" id="ob-disc"></div>
      </div>
      <div class="field"><label>Looking for</label>
        <div class="chip-row" id="ob-seek"></div>
      </div>
      <button class="primary-btn" id="ob-start">Start Swiping 🔥</button>
    </section>

    <!-- SWIPE -->
    <section class="screen" id="screen-swipe">
      <div id="deck"></div>
      <div id="empty">
        <h2>🌾 That's the whole herd!</h2>
        <p>Adjust your filters or check back when new horses trot into town.</p>
      </div>
      <div id="controls">
        <button id="rewind-btn" title="Rewind"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11a5 5 0 0 1 0 10h-2"/><path d="M7 5 3 9l4 4"/></svg></button>
        <button id="nope-btn" title="Nope"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
        <button id="like-btn" title="Like"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.5 4.2 12.7a4.8 4.8 0 0 1 6.8-6.8l1 1 1-1a4.8 4.8 0 0 1 6.8 6.8Z"/></svg></button>
        <a id="about-btn" title="About" href="https://benzi.fly.dev/about" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></a>
      </div>
    </section>

    <!-- MATCHES -->
    <section class="screen" id="screen-matches">
      <div class="list" id="matches-list"></div>
    </section>

    <!-- LIKED YOU -->
    <section class="screen" id="screen-liked">
      <div class="list" id="liked-list"></div>
    </section>

    <!-- CHAT -->
    <section class="screen" id="screen-chat">
      <div id="chat-head">
        <button class="back" onclick="go('matches')">‹</button>
        <span class="av" id="chat-av" onclick="if(chatWith)openProfile(chatWith.id)" style="cursor:pointer"></span>
        <div class="chat-head-txt" onclick="if(chatWith)openProfile(chatWith.id)" style="cursor:pointer"><b id="chat-name">Name</b><div id="chat-status" class="chat-status off"></div></div>
      </div>

<script>
// ============================================================

const DISCIPLINES = ["trail","dressage","racing","barrel","driving","shows","jumping"];
const GENDERS = ["mare","stallion","gelding"];

// ---- SVG horse portraits: distinct per horse, no external images ----
// coat = body color, mane = mane/tail color, marking = face pattern.
// pick a silhouette by BREED so a Clydesdale never looks like a Shetland.
// 0 = sleek, 1 = draft, 2 = pony, 3 = elegant
function shapeForBreed(breed) {
  const b = (breed || "").toLowerCase();
  const draft = ["clydesdale","percheron","friesian","shire","belgian","fjord","haflinger"];
  const pony  = ["shetland","welsh","pony","connemara","dartmoor"];
  const eleg  = ["andalusian","lipizzaner","akhal-teke","arabian","lusitano"];
  if (draft.some(x => b.includes(x))) return 1;
  if (pony.some(x => b.includes(x)))  return 2;
  if (eleg.some(x => b.includes(x)))  return 3;
  return 0;   // thoroughbred, quarter horse, mustang, appaloosa, morgan, paint, walker...
}
// A shuffled background SCENE per horse: sunset, meadow, day-sky, night,
// studio-blush, sunrise. Returns <defs> gradients + a full-frame <rect> +
// a little scenery (sun, hills, stars). Stable per horse via id.
function bgScene(h, seed) {
  const sd = (seed == null) ? h.id : seed;
  const scenes = ["sunset","meadow","daysky","night","studio","sunrise"];
  const name = scenes[(sd * 7 + 2) % scenes.length];
  const gid = "bg" + h.id + "_" + sd;   // unique per photo so gradients don't collide
  const g = (c1, c2) => `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
  const fill = `<rect width="240" height="240" fill="url(#${gid})"/>`;
  // a few deterministic stars for the night scene
  const stars = () => {
    let s = "";
    for (let i = 0; i < 14; i++) {
      const x = (h.id * 37 + i * 53) % 240, y = (h.id * 19 + i * 29) % 120;
      s += `<circle cx="${x}" cy="${y}" r="${i % 3 === 0 ? 1.6 : 1}" fill="#fff" opacity=".85"/>`;
    }
    return s;
  };
  switch (name) {
    case "sunset":
      return `<defs>${g("#ff9a6b", "#ff5f8f")}</defs>${fill}
        <circle cx="120" cy="150" r="46" fill="#ffd98a" opacity=".9"/>
        <path d="M0 175 Q60 150 120 172 T240 168 V240 H0 Z" fill="#c94f7c" opacity=".6"/>`;
    case "meadow":
      return `<defs>${g("#bfe3ff", "#eaf7d6")}</defs>${fill}
        <circle cx="188" cy="52" r="24" fill="#fff6b8" opacity=".85"/>
        <path d="M0 180 Q70 158 140 178 T240 172 V240 H0 Z" fill="#8fce6b"/>
        <path d="M0 200 Q80 184 160 200 T240 196 V240 H0 Z" fill="#6fb84e"/>`;
    case "daysky":
      return `<defs>${g("#7ec8ff", "#cdeaff")}</defs>${fill}
        <ellipse cx="70" cy="70" rx="34" ry="16" fill="#fff" opacity=".85"/>
        <ellipse cx="170" cy="110" rx="40" ry="18" fill="#fff" opacity=".7"/>`;
    case "night":
      return `<defs>${g("#243b6b", "#0e1630")}</defs>${fill}${stars()}
        <circle cx="184" cy="52" r="20" fill="#f4f0d0" opacity=".95"/>
        <circle cx="176" cy="46" r="20" fill="url(#${gid})" opacity=".9"/>`;
    case "sunrise":
      return `<defs>${g("#ffe6a0", "#ffb1c9")}</defs>${fill}
        <circle cx="120" cy="170" r="40" fill="#fff2c2"/>
        <path d="M0 190 Q60 176 120 190 T240 186 V240 H0 Z" fill="#e58fae" opacity=".55"/>`;
    default: // studio blush
      return `<defs>${g("#ffe3ec", "#ffd6c0")}</defs>${fill}
        <circle cx="120" cy="120" r="90" fill="#fff" opacity=".18"/>`;
  }
}
function horseSVG(h, px, seed) {
  const size = px || 240;

  const variant = shapeForBreed(h.breed);   // 0 sleek · 1 draft · 2 pony · 3 elegant, by breed
  // some horses face LEFT, some RIGHT -- deterministic per horse for variety.
  // flip horizontally around the 120 centre when facing left.
  const facesLeft = (h.id % 2 === 1);
  const flip = facesLeft ? "translate(240 0) scale(-1 1)" : "";

  // ---- SIZE the portrait by the horse's stats ----
  // height (hands) is the main driver: ~10 (Shetland pony) -> ~18 (Clydesdale).
  // age gives a small extra nudge (older reads as a bit bigger/sturdier).
  const hh = h.height || 15;
  let scale = 0.72 + (hh - 10) / 8 * 0.43;          // 10h->0.72  18h->1.15 (original)
  scale += Math.min((h.age || 5) - 4, 8) * 0.012;   // up to +~0.1 with age
  scale = Math.max(0.68, Math.min(1.2, scale));
  // anchor at bottom-centre
  // art's visual bottom is ~y=220; map THAT to the viewBox floor (240) so the
  // horse sits grounded, then xMidYMax aligns it to the bottom of any box.
  const gx = 120 - 120 * scale, gy = 240 - 220 * scale;

  // ---- shared face markings ----
  const blaze = h.marking === "blaze"
    ? `<path d="M120 78 q6 40 0 74 q-6 -34 0 -74 Z" fill="#fff" opacity=".9"/>` : "";
  const star = h.marking === "star"
    ? `<circle cx="120" cy="86" r="7" fill="#fff" opacity=".9"/>` : "";
  const spots = h.marking === "spots"

  const snip = h.marking === "snip"
    ? `<ellipse cx="120" cy="132" rx="8" ry="6" fill="#ffd9e0"/>` : "";
  const markings = blaze + star + snip + spots;

  // ---- 4 body/head shapes; each returns {body, eye:{x,y}, nose:{x,y}} ----
  const shapes = {
    // 0 -- SLEEK (thoroughbred / arabian): slim refined head, upright neck

        <path d="M102 70 L94 42 L116 64 Z" fill="${c}"/>
        <path d="M150 76 L164 50 L142 70 Z" fill="${c}"/>
        <path d="M104 66 L99 50 L112 63 Z" fill="${m}"/>
        <path d="M112 60 Q120 48 132 62 Q122 58 116 72 Z" fill="${m}"/>`,
      eye: { x: 130, y: 102 }, nose: { x: 113, y: 141 },
    },
    // 1 -- DRAFT (clydesdale / percheron): big blocky head, thick neck
    1: {
      body: `
        <path d="M78 220 L86 148 Q120 112 158 126 L172 220 Z" fill="${c}"/>
        <path d="M86 148 Q64 172 70 220 L92 220 Q84 176 104 150 Z" fill="${m}"/>
        <rect x="92" y="72" width="60" height="76" rx="26" fill="${c}"/>
        <ellipse cx="122" cy="146" rx="26" ry="19" fill="${d}"/>
        <path d="M96 76 L86 50 L114 70 Z" fill="${c}"/>
        <path d="M150 76 L162 50 L136 70 Z" fill="${c}"/>
        <path d="M98 74 L92 56 L108 70 Z" fill="${m}"/>
        <path d="M110 62 Q122 46 138 62 Q124 58 118 76 Z" fill="${m}"/>`,

        <ellipse cx="122" cy="118" rx="34" ry="34" fill="${c}"/>

        <path d="M98 92 L88 68 L114 88 Z" fill="${c}"/>
        <path d="M146 92 L158 68 L132 88 Z" fill="${c}"/>
        <path d="M104 100 Q122 74 142 98 Q128 88 122 108 Q116 88 104 100 Z" fill="${m}"/>`,
      eye: { x: 134, y: 110 }, nose: { x: 116, y: 146 },
    },
    // 3 -- ELEGANT (andalusian / friesian): long arched neck, flowing mane
    3: {
      body: `
        <path d="M96 220 L94 150 Q92 108 128 104 Q156 102 152 132 L166 220 Z" fill="${c}"/>
        <path d="M94 150 Q66 168 74 220 L96 220 Q86 176 100 148 Q92 122 108 106 L100 100 Q80 120 88 156 Z" fill="${m}"/>
        <path d="M112 62 Q156 66 152 116 Q150 150 120 152 Q100 150 102 112 Q104 66 112 62 Z" fill="${c}"/>
        <ellipse cx="118" cy="142" rx="16" ry="14" fill="${d}"/>
        <path d="M112 64 L106 38 L126 60 Z" fill="${c}"/>
        <path d="M150 74 L162 48 L140 68 Z" fill="${c}"/>
        <path d="M114 60 L109 44 L122 58 Z" fill="${m}"/>
        <path d="M118 56 Q128 42 140 58 Q130 54 124 70 Z" fill="${m}"/>`,
      eye: { x: 130, y: 104 }, nose: { x: 115, y: 143 },
    },
  };
  const s = shapes[variant];

  // ---- EXPRESSIONS: eyes + mouth, shuffled per horse ----
  // eye anchor (ex,ey), mouth sits below-forward of the muzzle.
  const ex = s.eye.x, ey = s.eye.y, mx = s.nose.x + 4, my = s.nose.y + 12;
  const faces = {
    happy: `
      <path d="M${ex-5} ${ey} Q${ex} ${ey-6} ${ex+5} ${ey}" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M${ex-14} ${ey-3} Q${ex} ${ey-9} ${ex+7} ${ey-4}" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
      <path d="M${mx-9} ${my} Q${mx} ${my+6} ${mx+9} ${my}" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    flirty: `
      <path d="M${ex-6} ${ey} Q${ex} ${ey-5} ${ex+6} ${ey}" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="${ex-16}" cy="${ey-2}" r="4.5" fill="#2b2b2b"/>
      <path d="M${mx-9} ${my+1} Q${mx-1} ${my+7} ${mx+9} ${my-2}" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    chill: `
      <path d="M${ex-6} ${ey-1} Q${ex} ${ey+3} ${ex+6} ${ey-1}" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M${ex-16} ${ey-1} Q${ex-10} ${ey+3} ${ex-4} ${ey-1}" stroke="#2b2b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M${mx-7} ${my+1} Q${mx} ${my+3} ${mx+7} ${my+1}" stroke="#3a2a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
    excited: `
      <circle cx="${ex}" cy="${ey}" r="7" fill="#2b2b2b"/><circle cx="${ex+2.5}" cy="${ey-2.5}" r="2.5" fill="#fff"/>
      <circle cx="${ex-16}" cy="${ey}" r="7" fill="#2b2b2b"/><circle cx="${ex-13.5}" cy="${ey-2.5}" r="2.5" fill="#fff"/>
      <ellipse cx="${mx}" cy="${my+3}" rx="8" ry="7" fill="#5a2a2a"/><ellipse cx="${mx}" cy="${my+5}" rx="4" ry="3" fill="#c86"/>`,
    cool: `
      <path d="M${ex-6} ${ey} L${ex+6} ${ey}" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
      <path d="M${ex-17} ${ey} L${ex-6} ${ey}" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
      <path d="M${mx-8} ${my} Q${mx} ${my+2} ${mx+9} ${my-3}" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    derp: `
      <circle cx="${ex}" cy="${ey-1}" r="6.5" fill="#2b2b2b"/><circle cx="${ex+2}" cy="${ey-3}" r="2" fill="#fff"/>
      <circle cx="${ex-16}" cy="${ey+2}" r="6.5" fill="#2b2b2b"/><circle cx="${ex-14}" cy="${ey}" r="2" fill="#fff"/>
      <path d="M${mx-7} ${my+2} Q${mx} ${my-2} ${mx+8} ${my+3}" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  };
  // shuffle, but nudge by temperament so personality shows
  const all = ["happy","flirty","chill","excited","cool","derp"];
  const bias = { playful:["excited","happy","derp"], spirited:["flirty","excited","cool"],
                 chill:["chill","happy"], stoic:["cool","chill","flirty"] }[h.temperament] || [];
  const bag = bias.concat(all);                 // biased picks appear more often
  const face = faces[bag[(sd * 5 + 1) % bag.length]];   // expression varies per photo seed

  return `
<svg viewBox="0 0 240 240" width="${size}" height="${size}" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    ${bgScene(h, sd)}
    <defs><filter id="sh${h.id}_${sd}" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.28"/>
    </filter></defs>
    <g filter="url(#sh${h.id}_${sd})" transform="translate(${gx.toFixed(1)} ${gy.toFixed(1)}) scale(${scale.toFixed(3)})">
      <g transform="${flip}">
        ${s.body}
        ${markings}
        ${face}
        <ellipse cx="${s.nose.x}" cy="${s.nose.y}" rx="3" ry="4" fill="#3a2a2a"/>
        <ellipse cx="${s.nose.x + 12}" cy="${s.nose.y + 2}" rx="3" ry="4" fill="#3a2a2a"/>
      </g>
    </g>
  </svg>`;
}
// lighten (amt>0) / darken (amt<0) a #rrggbb hex color
function shade(hex, amt) {
  let n = parseInt(hex.slice(1), 16);
  let r = Math.max(0, Math.min(255, (n >> 16) + amt));
  let g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  let b = Math.max(0, Math.min(255, (n & 255) + amt));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

  { id:20, name:"Shadow", breed:"Friesian", age:8, gender:"gelding", temperament:"stoic",
    disciplines:["dressage","driving"], bio:"Tall, dark, and dramatic. My mane has its own fan club.", height:16.2, coat:"#26262b", mane:"#111114", marking:"none", stable:"Churchill Barn", distance:9, verified:true },
];

// ============================================================
// ONLINE-STATUS ENGINE
// A live set of "active now" horses (one source of truth, read via isOnline()).
// ~75% start online; every 25s horses flip (offline->online readily, online->offline
// flip. When a horse comes ONLINE we fire onHorseOnline() so chat can
// deliver queued replies and the badge can pulse. Offline horses go quiet.
// ============================================================
const ONLINE = new Set();
const lastSeen = {};   // id -> minutes-ago label seed for offline horses

function _seedOnline() {
  HERD.forEach(h => {
    if (Math.random() < 0.75) ONLINE.add(h.id);
    else lastSeen[h.id] = 1 + Math.floor(Math.random() * 47);  // "Active Xh/Xm ago"
  });
}
function isOnline(id) { return ONLINE.has(id); }
function lastSeenLabel(id) {
  const m = lastSeen[id] || 12;
  return m < 60 ? `Active ${m}m ago` : `Active ${Math.round(m / 60)}h ago`;
}

// flip a few horses every 25s so the herd feels alive
function _tickOnline() {
  HERD.forEach(h => {
    const flip = ONLINE.has(h.id) ? 0.05 : 0.25;   // rarely go offline, readily come online
    if (Math.random() < flip) {
      if (ONLINE.has(h.id)) {                     // going OFFLINE
        ONLINE.delete(h.id);
        lastSeen[h.id] = 1;
        onHorseOffline(h.id);
      } else {                                     // coming ONLINE
        ONLINE.add(h.id);
        onHorseOnline(h.id);
      }
    }
  });
  // repaint any visible status
  // NOTE: don't rebuild the swipe deck on a tick -- it would reshuffle and flicker
  // the card's status out from under the user. The deck refreshes between swipes
  // (renderDeck runs after each swipe & on entering the screen); matching always
  // reads the live isOnline() at swipe time, so card + chat stay one system.
  if (document.getElementById("screen-matches").classList.contains("active")) renderMatches();
  if (document.getElementById("screen-liked").classList.contains("active")) renderLikedYou();
  if (document.getElementById("screen-chat").classList.contains("active") && typeof renderChatStatus === "function") { renderChatStatus(); renderChat(); }
}

// hooks -- defined fully in the chat section; guarded so early ticks are safe
function onHorseOnline(id)  { if (typeof _chatHorseOnline  === "function") _chatHorseOnline(id); }
function onHorseOffline(id) { if (typeof _chatHorseOffline === "function") _chatHorseOffline(id); }

_seedOnline();
setInterval(_tickOnline, 25000);

// ============================================================
// OPENERS -- the FIRST message a match sends you.
// Deliberately open-ended (not yes/no questions), so an LLM backend can
// take the conversation anywhere from here. {you}/{disc} fill from profile.
// ============================================================
const OPENERS = [
  "wow {you}, nice to match! 🐴 I saw you're big on {disc} — how'd you get into it?",
  "hi {you}! 🍎 ok important question before anything else — what's your snack of choice?",
  "okay {you}, real talk 😏 your profile says {disc}... how long have you been at it?",
  "hey {you} 👋 you seem like trouble in the best way. tell me something about yourself?",
  "{you}! finally someone with taste 💅 what's your ideal day look like?",
  "hi {you} 🌾 be honest — best trail you've ever been on?",
  "well hello {you} 😌 what made you swipe right on me?",
  "hey {you}! 🐎 {disc} horse huh? what's the story there?",
];

const pickFrom = arr => arr[Math.floor(Math.random() * arr.length)];

// ============================================================
// LIVE LLM REPLIES via the backend at POST /horse_chat (same origin).
// The server holds the DeepSeek key -- nothing secret lives in this page.
// We only build the messages array (the personas live here) and read
// { reply } back. Any failure falls back to the local reply() pool below,
// so the chat never breaks.
// ============================================================

// Build the OpenAI-style messages array for ONE horse: persona + history.
function horseMessages(horse) {
  const p = S.profile || {};
  const you = p.name || "cutie";
  const yourDiscs = (p.disciplines || []).join(", ") || "trail";
  const theirDiscs = (horse.disciplines || []).join(", ") || "trail";

  const persona = [
    `You are ${horse.name}, a ${horse.age}-year-old ${horse.gender} ${horse.breed || "horse"} on a horse dating app.`,
    `Your temperament is ${horse.temperament}. You are into ${theirDiscs}.`,
    `Your dating bio reads: "${horse.bio || ""}".`,
    `You are flirting with ${you}, a ${p.age || "?"}-year-old ${p.gender || "horse"} whose temperament is ${p.temperament || "unknown"} and who is into ${yourDiscs}.`,
    `Reply with ONE short flirty text message, max 20 words, all lowercase.`,
    `Use horse puns sparingly. At most one emoji. Never mention being an AI or a model.`,
  ].join(" ");

  // from:"them" -> assistant (the horse's OWN lines, incl. its opener)
  // from:"me"   -> user      (you)
  const history = (S.threads[horse.id] || []).map(m => ({
    role: m.from === "them" ? "assistant" : "user",
    content: m.text,
  }));

  return [{ role: "system", content: persona }, ...history];
}

// Ask the backend for this horse's next line. Always resolves to a usable
// string -- falls back to the local pool on any failure or a null reply.
async function horseReply(horse) {
  try {
    const res = await fetch("/horse_chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: horseMessages(horse) }),
    });
    if (!res.ok) {
      console.warn("[horse_chat]", res.status, await res.text().catch(() => ""));
      return reply(horse);
    }
    const data = await res.json();
    const out = (data && data.reply != null) ? String(data.reply).trim() : "";
    return out || reply(horse);
  } catch (e) {
    console.warn("[horse_chat] failed, using local reply:", e);
    return reply(horse);
  }
}

// Every reply a match sends is profile-aware: it sprinkles in YOUR name,
// age, discipline or temperament so the whole chat feels personal.
function reply(horse) {
  const p = S.profile || {};
  const you = p.name || "cutie";
  const disc = (p.disciplines && p.disciplines[0]) || "trail";
  const shared = (p.disciplines || []).filter(d => horse.disciplines.includes(d))[0];
  const age = p.age;
  const temp = p.temperament;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // a pool where EVERY variant name-drops something of yours
  const pool = [
    `Neigh way ${you}, that's so sweet! 🥰`,
    `Hay there ${you} 👋 tell me more!`,
    `You had me at 'apples' ${you} 🍎`,
    `Trotting over to your paddock now, ${you} 😏`,
    `Stable relationship with you, ${you}? I'm in. 💕`,
    `That's un-bri-dled charm, ${you} 😍`,
    `Foal-ing for you already ${you} 🐴`,
    `Let's canter into the sunset, ${you} 🌅`,
    `A ${disc} horse like you is exactly my type, ${you} 💘`,
    `Honestly ${you}, best swipe of my day 🐎`,
    `ok but genuinely ${you}, how is nobody else in this paddock talking about ${disc}? 😤`,
    `I reread your profile twice ${you}. purely for research purposes obviously 🧐`,
    `warning: I've already told my whole stable about you, ${you} 🙈`,
    `you seem like the type to steal the good hay and I respect that, ${you} 😌`,
    `${you} I'm not saying it's fate, but we did both end up here 🌙`,
    `hot take ${you}: sunrise ${disc} > sunset ${disc}. defend your position ⚔️`,
    `if I asked you to run off to a nicer pasture ${you}, hypothetically... 🌾`,
    `something about you feels dangerously easy to talk to, ${you} 💭`,
  ];
  if (shared) pool.push(`Can't stop thinking about that ${shared} date, ${you} 🥰`,
                        `We're SO doing ${shared} this weekend, ${you} 🔥`);
  if (age) pool.push(`${age} and this charming? ${you}, you're a rare breed 😌`,
                     `They don't make ${age}-year-olds like you anymore, ${you} 💕`);
  if (temp === "spirited") pool.push(`Keep up that fire, ${you}, and I'm yours 🔥`);
  if (temp === "chill") pool.push(`Love how easygoing you are, ${you} 😌`);
  if (temp === "playful") pool.push(`You're SO much fun, ${you} 🎉`);
  if (temp === "stoic") pool.push(`Strong and mysterious, ${you}... I'm intrigued 🖤`);

  return pick(pool);
}


// ---- personalized opener: the FIRST message a match sends you ----
// Uses YOUR profile (name, disciplines, temperament, age) so it lands
// like they actually read your bio. Always name-drops something of yours.
function opener(horse) {
  const p = S.profile || {};
  const you = p.name || "cutie";
  const disc = (p.disciplines && p.disciplines[0]) || "trail";
  return pickFrom(OPENERS).replace(/{you}/g, you).replace(/{disc}/g, disc);
}

// Fire the horse's personalized opener into a fresh thread (only if empty).
// Opener only fires if the horse is ONLINE. Offline horses stay silent
// (they haven't "seen" the match yet) and catch up when they come online.
function sendOpener(horse) {
  S.threads[horse.id] = S.threads[horse.id] || [];
  if (S.threads[horse.id].length === 0 && isOnline(horse.id)) {
    S.threads[horse.id].push({ from: "them", text: opener(horse) });
    save();
  }
}

// -- online hooks (called by the status engine's _tickOnline) --
// When a matched horse comes ONLINE: send its opener if it never did, then
// if you messaged while they were away, fire ONE catch-up reply. Pulse the
// badge so you notice, unless you're already looking at that chat.
function _chatHorseOnline(id) {
  if (!S.matched.includes(id)) return;
  const horse = HERD.find(h => h.id === id);
  const t = (S.threads[id] = S.threads[id] || []);
  let didSomething = false;

  if (t.length === 0) {                       // never sent opener -> send it now
    t.push({ from: "them", text: opener(horse) });
    didSomething = true;
  }
  // any of YOUR messages after their last reply? -> one catch-up reply
  const lastThem = t.map(m => m.from).lastIndexOf("them");
  const youWaiting = t.slice(lastThem + 1).some(m => m.from === "me");
  if (youWaiting) {
    if (chatWith && chatWith.id === id) showTyping();  // only if that chat is open
    horseReply(horse).then(t => {
      if (!isOnline(id)) { hideTyping(); return; }     // went offline mid-think
      typeThenReply(id, t, true);                      // already waited -> reveal now
    });
    didSomething = true;
  } else if (didSomething && chatWith && chatWith.id === id) {
    renderChat();
  }
  if (didSomething) {
    save();
    if (!(chatWith && chatWith.id === id)) pulseBadge();   // notify
    if (document.getElementById("screen-matches").classList.contains("active")) renderMatches();
  }
}
// When a horse goes OFFLINE mid-chat: cancel any pending typing/reply.
function _chatHorseOffline(id) {
  if (pendingReply[id]) { clearTimeout(pendingReply[id]); delete pendingReply[id]; }
  if (chatWith && chatWith.id === id) { hideTyping(); renderChatStatus(); }
}

// ---- typing indicator + gated reply helpers ----
const pendingReply = {};   // id -> setTimeout handle (so we can cancel on offline)

function showTyping() {
  const box = document.getElementById("chat-msgs");
  if (document.getElementById("typing-bubble")) return;
  const el = document.createElement("div");
  el.className = "bubble them typing"; el.id = "typing-bubble";
  el.innerHTML = `<span></span><span></span><span></span>`;
  box.appendChild(el); box.scrollTop = box.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typing-bubble");
  if (t) t.remove();
}
// Queue a reply that only lands if the horse is STILL online when it fires.
// `immediate` = the caller already spent real time thinking (an LLM fetch, with
// the typing bubble up the whole time), so don't stack the fake delay on top --
// reveal promptly instead. showTyping() is idempotent, so a bubble the caller
// already raised is reused rather than duplicated.
function typeThenReply(id, text, immediate) {
  if (pendingReply[id]) clearTimeout(pendingReply[id]);
  const open = chatWith && chatWith.id === id;
  if (open) showTyping();
  const wait = immediate ? 0 : 1100 + Math.random() * 900;
  pendingReply[id] = setTimeout(() => {
    delete pendingReply[id];
    if (!isOnline(id)) { hideTyping(); return; }      // went offline mid-type -> silence
    hideTyping();
    (S.threads[id] = S.threads[id] || []).push({ from: "them", text });
    save();
    if (chatWith && chatWith.id === id) { renderChat(); ding("msg"); }
    else pulseBadge();
    if (document.getElementById("screen-matches").classList.contains("active")) renderMatches();
  }, wait);
}
// ---- persisted state ----
const DEFAULT_STATE = () => ({
  profile: null,               // {name, age, height, temperament, disciplines}
  filters: { dist:500, ageMin:1, ageMax:40, genders:[...GENDERS], shared:false },
  liked: [],                   // horse ids you swiped right
  passed: [],                  // horse ids you swiped left
  matched: [],                 // horse ids that matched back
  admirers: [],                // horse ids that already liked YOU (secret admirers)
  threads: {},                 // { horseId: [{from:'me'|'them', text}] }
  lastPassed: null,
});
let S = load();

function load() {
  const d = DEFAULT_STATE();
  try {
    const raw = localStorage.getItem("stallionswipe");
    if (raw) {
      const saved = JSON.parse(raw);
      // shallow-merge top level, but DEEP-merge filters so an older saved
      // state that lacks a filter field can't leave e.g. genders undefined.
      const merged = Object.assign(d, saved);
      merged.filters = Object.assign(DEFAULT_STATE().filters, saved.filters || {});
      // guard the array fields
      for (const k of ["liked","passed","matched","admirers"])
        if (!Array.isArray(merged[k])) merged[k] = [];
      if (!merged.threads || typeof merged.threads !== "object") merged.threads = {};
      return merged;
    }
  } catch (e) { console.warn("load failed, resetting", e); }
  return d;
}
function save() { localStorage.setItem("stallionswipe", JSON.stringify(S)); }

// Seed "secret admirers" once: a spread of horses who already liked you.
// Deterministic-ish pick so the Liked You list feels real from the first launch.
function seedAdmirers() {
  if (S.admirers && S.admirers.length) return;
  const picks = [1, 4, 8, 11, 14, 18];   // Bella, Willow, Luna, Seabiscuit, Apollo, Zephyr
  S.admirers = picks;
  save();
}
seedAdmirers();
function likedYou(id) { return S.admirers.includes(id); }

// ---- scoring (mirrors compatibility() in stallionswipe.py) ----
function compatibility(me, h) {
  let score = 42;
  const shared = me.disciplines.filter(d => h.disciplines.includes(d));
  score += 12 * shared.length;
  if (me.temperament === h.temperament) score += 10;
  if (Math.abs(me.age - h.age) <= 4) score += 8;
  if (Math.abs(me.height - h.height) <= 2) score += 6;
  if (h.distance <= 10) score += 6; else if (h.distance <= 50) score += 3;
  if (h.verified) score += 4;
  if (h.gender === "gelding") score = Math.min(score, 82);
  return Math.max(0, Math.min(100, score));
}
function passesFilters(h) {
  const f = S.filters;
  if (!f.genders.includes(h.gender)) return false;
  if (h.age < f.ageMin || h.age > f.ageMax) return false;
  if (h.distance > f.dist) return false;
  if (f.shared && !S.profile.disciplines.some(d => h.disciplines.includes(d))) return false;
  return true;
}
function theyLikeYouBack(h) {
  // compatibility-driven, but skewed LOW so weak matches often get rejected.
  // squaring punishes low scores hard; 0.85 caps the very best around ~75%.
  const c = compatibility(S.profile, h) / 100;
  return Math.random() < (c * c) * 0.85;
}

// ---- deck ----
function buildDeck() {
  const seen = new Set([...S.liked, ...S.passed]);
  return HERD
    .filter(h => !seen.has(h.id) && passesFilters(h))
    .map(h => ({ ...h, score: compatibility(S.profile, h) }))
    .sort((a, b) => b.score - a.score);
}
let deck = [];

// ---- screen routing ----
function go(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.go === name));
  if (name === "swipe") renderDeck();
  if (name === "matches") renderMatches();
  if (name === "liked") renderLikedYou();
}

// ---- DOM refs ----
const deckEl = document.getElementById("deck");
const emptyEl = document.getElementById("empty");

function renderDeck() {
  deck = buildDeck();
  deckEl.innerHTML = "";
  emptyEl.style.display = deck.length === 0 ? "flex" : "none";
  deck.slice().reverse().forEach((h, i) => {
    const idx = deck.length - 1 - i;
    if (idx > 2) return; // only stack the top 3 for perf
    const card = document.createElement("div");
    card.className = "card" + (isOnline(h.id) ? " online" : "");
    card.dataset.idx = idx;
    card.style.zIndex = deck.length - idx;
    card.style.transform = `scale(${1 - idx * 0.03}) translateY(${idx * 8}px)`;
    card.innerHTML = `
      <div class="score">💘 ${h.score}%</div>
      ${likedYou(h.id) ? '<div class="likesyou">⭐ Likes you</div>' : ''}
      <div class="stamp like">Like</div>
      <div class="stamp nope">Nope</div>
      <div class="photo">${h.verified ? '<span class="verified">✓</span>' : ''}${horseSVG(h)}</div>
      <div class="info">
        <h2>${h.name} <span>${h.age}</span>
          <button class="info-btn" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onclick="event.stopPropagation(); openProfile(${h.id})">View profile ›</button>
        </h2>
        <div class="status ${isOnline(h.id) ? 'on' : 'off'}"><span class="dot"></span>${isOnline(h.id) ? 'Active now' : lastSeenLabel(h.id)}</div>
        <div class="meta">${h.breed} · ${h.gender} · ${h.height} hands · ${h.distance}km away</div>
        <div class="bio">${h.bio}</div>
        <div class="tags">${h.disciplines.map(d => `<span>${d}</span>`).join("")}</div>
      </div>`;
    if (idx === 0) attachDrag(card);
    deckEl.appendChild(card);
  });
}

function topCard() { return deckEl.querySelector('.card[data-idx="0"]'); }

function doSwipe(liked, superLike) {
  const card = topCard();
  if (!card || deck.length === 0) return;
  const horse = deck[0];
  card.classList.add(liked ? "gone-right" : "gone-left");
  ding(liked ? "send" : "nope");
  if (liked) {
    S.liked.push(horse.id);
    S.lastPassed = null;
  } else {
    S.passed.push(horse.id);
    S.lastPassed = horse.id;
  }
  // an admirer (already liked you) or a super-like guarantees the match
  const matched = liked && (superLike || likedYou(horse.id) || theyLikeYouBack(horse));
  if (matched && !S.matched.includes(horse.id)) {
    S.matched.push(horse.id);
    S.threads[horse.id] = S.threads[horse.id] || [];
    sendOpener(horse);                                      // they message first, personalized
    S.admirers = S.admirers.filter(id => id !== horse.id);  // no longer "pending"
  }
  save();
  setTimeout(() => {
    renderDeck();
    updateBadge();
    if (matched) showMatch(horse);
  }, 340);
}

function rewind() {
  if (S.lastPassed == null) { toast("Nothing to rewind"); return; }
  S.passed = S.passed.filter(id => id !== S.lastPassed);
  S.lastPassed = null;
  save(); renderDeck();
  // animate the restored card dropping back in from the top
  const top = topCard();
  if (top) { top.classList.add("rewind-in"); top.addEventListener("animationend", () => top.classList.remove("rewind-in"), { once: true }); }
  toast("Rewound!");
}

// ---- drag ----
function attachDrag(card) {
  let startX = 0, curX = 0, dragging = false;
  const like = card.querySelector(".stamp.like");
  const nope = card.querySelector(".stamp.nope");
  const down = e => { dragging = true; startX = (e.touches ? e.touches[0].clientX : e.clientX); card.style.transition = "none"; };
  const likeBtn = document.getElementById("like-btn"), nopeBtn = document.getElementById("nope-btn");
  const move = e => {
    if (!dragging) return;
    curX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    card.style.transform = `translateX(${curX}px) rotate(${curX / 20}deg)`;
    like.style.opacity = curX > 0 ? Math.min(curX / 100, 1) : 0;
    nope.style.opacity = curX < 0 ? Math.min(-curX / 100, 1) : 0;
    likeBtn.classList.toggle("glow", curX > 40);      // live drag-glow
    nopeBtn.classList.toggle("glow", curX < -40);
  };
  const clearGlow = () => { likeBtn.classList.remove("glow"); nopeBtn.classList.remove("glow"); };
  const up = () => {
    if (!dragging) return;
    dragging = false; card.style.transition = ""; clearGlow();
    if (Math.abs(curX) > 110) doSwipe(curX > 0, false);
    else { card.style.transform = ""; like.style.opacity = 0; nope.style.opacity = 0; }
    curX = 0;
  };
  card.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  card.addEventListener("touchstart", down, { passive: true });
  card.addEventListener("touchmove", move, { passive: true });
  card.addEventListener("touchend", up);
}

// ---- matches list ----
function renderMatches() {
  const el = document.getElementById("matches-list");
  const ms = S.matched.map(id => HERD.find(h => h.id === id)).filter(Boolean)
    .sort((a, b) => compatibility(S.profile, b) - compatibility(S.profile, a));
  if (ms.length === 0) {
    el.innerHTML = `<div class="empty-note">No matches yet 🐴<br>Keep swiping to find your herd!</div>`;
    return;
  }
  el.innerHTML = `<h3>${ms.length} Match${ms.length>1?"es":""}</h3>` + ms.map(h => {
    const t = S.threads[h.id] || [];
    const last = t.length ? t[t.length-1].text : "You matched! Say hi 👋";
    return `<div class="match-row" onclick="openChat(${h.id})">
      <div class="av${isOnline(h.id) ? ' av-online' : ''}">${horseSVG(h, 48)}</div>
      <div><div class="who">${h.name} ${h.verified?'✓':''}</div>
           <div class="last">${isOnline(h.id) ? '<span class="mini-on">● Active now</span>' : last.slice(0,30)}</div></div>
      <div class="pct">${compatibility(S.profile, h)}%</div>
    </div>`;
  }).join("");
}

let chatWith = null;
// ---- tap-to-expand profile detail with icebreaker prompts ----
const ICEBREAKERS = {
  racing:  "The fastest I've ever galloped...",

const PROMPTS_EXTRA = [

  ["A fact that surprises people", "I'm scared of tiny ponies. No I won't explain."],

// how many gallery photos this horse has (2-5, stable per horse)
function galleryCount(h) { return 2 + (h.id % 4); }
// the horizontal strip of photos: same horse, different bg + expression per seed
function galleryPhotos(h) {
  let out = "";
  for (let i = 0; i < galleryCount(h); i++) {
    const seed = h.id + i * 137;   // distinct seed -> different scene + expression
    out += `<div class="p-slide">${horseSVG(h, 240, seed)}</div>`;
  }
  return out;   // arrows live OUTSIDE the strip so they don't scroll away
}
function galleryDots(h) {
  let d = "";
  for (let i = 0; i < galleryCount(h); i++) d += `<span onclick="galleryGo(${i})" class="${i === 0 ? 'on' : ''}"></span>`;
  return d;
}
// jump to photo index i
function galleryGo(i) {
  const strip = document.getElementById("p-gallery");
  if (strip) strip.scrollTo({ left: i * strip.clientWidth, behavior: "smooth" });
}
// step relative to the current photo (arrows)
function galleryStep(dir) {
  const strip = document.getElementById("p-gallery");
  if (!strip) return;
  const cur = Math.round(strip.scrollLeft / strip.clientWidth);
  galleryGo(cur + dir);
}
// sync the dots to the scroll position of the strip
function wireGallery() {
  const strip = document.getElementById("p-gallery");
  const dots = document.getElementById("p-dots");
  if (!strip || !dots) return;
  strip.onscroll = () => {
    const i = Math.round(strip.scrollLeft / strip.clientWidth);
    [...dots.children].forEach((dot, k) => dot.classList.toggle("on", k === i));
  };
  // mouse click-drag to swipe photos (touch/trackpad already scroll-snap natively)
  let down = false, startX = 0, startScroll = 0, moved = false;
  strip.onmousedown = e => { down = true; moved = false; startX = e.pageX; startScroll = strip.scrollLeft; strip.style.scrollSnapType = "none"; strip.style.cursor = "grabbing"; };
  strip.onmousemove = e => {
    if (!down) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    strip.scrollLeft = startScroll - dx;
  };
  const endDrag = () => {
    if (!down) return;
    down = false; strip.style.cursor = "grab"; strip.style.scrollSnapType = "x mandatory";
    if (moved) galleryGo(Math.round(strip.scrollLeft / strip.clientWidth));  // snap to nearest
  };
  strip.onmouseup = endDrag;
  strip.onmouseleave = endDrag;
}

      <div class="prompt"><b>Ask me about my ${h.disciplines[0]}</b>${ib}</div>

  document.getElementById("profile-modal").classList.add("open");

}
function closeProfile() { document.getElementById("profile-modal").classList.remove("open"); }

function openChat(id) {
  chatWith = HERD.find(h => h.id === id);
  document.getElementById("chat-av").innerHTML = horseSVG(chatWith, 34);
  document.getElementById("chat-name").textContent = chatWith.name;
  renderChatStatus();
  renderChat();
  go("chat");
}
// header line under the name: green "Active now" or grey last-seen
function renderChatStatus() {
  const el = document.getElementById("chat-status");
  if (!el || !chatWith) return;
  if (isOnline(chatWith.id)) { el.textContent = "● Active now"; el.className = "chat-status on"; }
  else { el.textContent = lastSeenLabel(chatWith.id); el.className = "chat-status off"; }
}
function renderChat() {
  const box = document.getElementById("chat-msgs");
  const t = S.threads[chatWith.id] || [];
  if (!t.length) {
    box.innerHTML = `<div class="empty-note">You matched with ${chatWith.name}! Send the first neigh 🐴</div>`;
    return;
  }
  // find the last of YOUR messages so we can label its delivery state
  const lastMineIdx = t.map(m => m.from).lastIndexOf("me");
  box.innerHTML = t.map((m, i) => {
    let bubble = `<div class="bubble ${m.from === 'me' ? 'me' : 'them'}">${m.text}</div>`;
    // if your last message hasn't been answered, show a receipt
    if (m.from === "me" && i === lastMineIdx && t.map(x=>x.from).lastIndexOf("them") < i) {
      const receipt = isOnline(chatWith.id) ? "Delivered" : "Delivered · they're offline 🌙";
      bubble += `<div class="receipt">${receipt}</div>`;
    }
    return bubble;
  }).join("");
  box.scrollTop = box.scrollHeight;
}
function sendMsg() {
  const inp = document.getElementById("chat-text");
  const text = inp.value.trim();
  if (!text || !chatWith) return;
  S.threads[chatWith.id] = S.threads[chatWith.id] || [];
  S.threads[chatWith.id].push({ from: "me", text });
  inp.value = "";
  save(); renderChat(); ding("send");
  // ONLINE -> they reply (with typing indicator). OFFLINE -> left on read.
  if (isOnline(chatWith.id)) {
    const who = chatWith;                             // pin it: async resolve
    showTyping();                                     // bubble up DURING the fetch
    horseReply(who).then(t => {
      if (!isOnline(who.id)) { hideTyping(); return; } // went offline mid-think
      typeThenReply(who.id, t, true);                 // already waited -> reveal now
    });
  }
}
// ---- match modal ----
let modalHorse = null;
function showMatch(horse) {
  modalHorse = horse;
  document.getElementById("match-emojis").innerHTML =
    `<span style="display:inline-block;width:88px;height:88px;border-radius:50%;overflow:hidden;vertical-align:middle;box-shadow:0 4px 14px rgba(0,0,0,.4)">${horseSVG(horse, 88)}</span>`

  document.getElementById("match-text").innerHTML = `You and <b>${horse.name}</b> both swiped right.`;

}
function closeMatch() { document.getElementById("match-modal").style.display = "none"; }
// confetti + floating hearts burst over the match modal
function celebrate() {
  const wrap = document.getElementById("match-modal");
  const bits = [..."🎉💕✨🐴💖🎊💘🧡"];   // spread splits by CODE POINT, not surrogate halves
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = bits[Math.floor(Math.random() * bits.length)];
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (12 + Math.random() * 20) + "px";
    s.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 3200);
  }
}
document.getElementById("mm-say").addEventListener("click", () => { closeMatch(); openChat(modalHorse.id); });

// ---- badge + toast ----
function updateBadge() {
  const b = document.getElementById("match-badge");
  b.textContent = S.matched.length;
  b.style.display = S.matched.length ? "inline-block" : "none";
  const lb = document.getElementById("liked-badge");
  const pending = S.admirers.filter(id => !S.liked.includes(id) && !S.passed.includes(id)).length;
  lb.textContent = pending;
  lb.style.display = pending ? "inline-block" : "none";
}

// pulse the matches badge to draw attention (new match / new reply)
function pulseBadge() {
  const b = document.getElementById("match-badge");
  if (!b) return;
  b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
}

// ---- tiny WebAudio sound effects (muteable, no files) ----
let _audioCtx = null;
let soundOn = (localStorage.getItem("ss-sound") !== "off");
function ding(kind) {
  if (!soundOn) return;
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx, t = ctx.currentTime;
    const notes = { send: [660], msg: [520, 780], match: [523, 659, 784], nope: [200] }[kind] || [440];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const s = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.12, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
      o.start(s); o.stop(s + 0.24);
    });
  } catch (e) {}
}
function setSound(on) {
  soundOn = on;
  localStorage.setItem("ss-sound", soundOn ? "on" : "off");
  if (soundOn) ding("send");
}
function renderLikedYou() {
  const el = document.getElementById("liked-list");
  const pend = S.admirers
    .filter(id => !S.matched.includes(id) && !S.passed.includes(id))
    .map(id => HERD.find(h => h.id === id)).filter(Boolean)
    .sort((a, b) => compatibility(S.profile, b) - compatibility(S.profile, a));
  if (pend.length === 0) {
    el.innerHTML = `<div class="empty-note">No pending admirers ⭐<br>When a horse likes you, they'll show up here!</div>`;
    return;
  }
  el.innerHTML = `<h3>${pend.length} horse${pend.length>1?"s":""} liked you</h3>` + pend.map(h =>
    `<div class="match-row">
      <div class="av">${horseSVG(h, 48)}</div>
      <div><div class="who">${h.name} ${h.verified?'✓':''}</div>
           <div class="last">${h.breed} · ${h.distance}km away</div></div>
      <div class="likeback">
        <button class="lb-nope" onclick="likeBack(${h.id}, false)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
        <button class="lb-yes" onclick="likeBack(${h.id}, true)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.5 4.2 12.7a4.8 4.8 0 0 1 6.8-6.8l1 1 1-1a4.8 4.8 0 0 1 6.8 6.8Z"/></svg></button>
      </div>
    </div>`).join("");
}
// Act on an admirer straight from the Liked You list.
function likeBack(id, yes) {
  const horse = HERD.find(h => h.id === id);
  if (yes) {
    if (!S.liked.includes(id)) S.liked.push(id);
    if (!S.matched.includes(id)) { S.matched.push(id); S.threads[id] = S.threads[id] || []; }
    sendOpener(horse);                                      // personalized first message
    S.admirers = S.admirers.filter(x => x !== id);
    save(); updateBadge(); renderLikedYou(); showMatch(horse);
  } else {
    if (!S.passed.includes(id)) S.passed.push(id);
    S.admirers = S.admirers.filter(x => x !== id);
    save(); updateBadge(); renderLikedYou(); toast("Passed on " + horse.name);
  }
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

// ---- onboarding wiring ----
function buildChips(containerId, values, selected, single) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  values.forEach(v => {
    const c = document.createElement("div");
    c.className = "chip" + (selected.includes(v) ? " on" : "");
    c.textContent = v;
    c.onclick = () => {
      if (single) { selected.length = 0; selected.push(v); }
      else if (selected.includes(v)) selected.splice(selected.indexOf(v), 1);
      else selected.push(v);
      buildChips(containerId, values, selected, single);
    };
    el.appendChild(c);
  });
}
const obDisc = ["trail","dressage"];
const obSeek = [...GENDERS];
buildChips("ob-disc", DISCIPLINES, obDisc, false);
buildChips("ob-seek", GENDERS, obSeek, false);

});

// ---- filters wiring ----
const fDist = document.getElementById("f-dist"), fvDist = document.getElementById("fv-dist");
const fMin = document.getElementById("f-agemin"), fMax = document.getElementById("f-agemax"), fvAge = document.getElementById("fv-age");
const gChips = [];
function refreshFilterUI() {
  fDist.value = S.filters.dist; fvDist.textContent = S.filters.dist + " km";
  fMin.value = S.filters.ageMin; fMax.value = S.filters.ageMax;
  fvAge.textContent = `${S.filters.ageMin} – ${S.filters.ageMax}`;
  gChips.length = 0; gChips.push(...S.filters.genders);
  buildChips("f-gender", GENDERS, gChips, false);
  document.getElementById("f-shared").checked = S.filters.shared;
  document.getElementById("f-sound").checked = soundOn;
}
fDist.oninput = () => fvDist.textContent = fDist.value + " km";
fMin.oninput = fMax.oninput = () => fvAge.textContent = `${Math.min(+fMin.value,+fMax.value)} – ${Math.max(+fMin.value,+fMax.value)}`;
document.getElementById("f-apply").addEventListener("click", () => {
  S.filters.dist = +fDist.value;
  S.filters.ageMin = Math.min(+fMin.value, +fMax.value);
  S.filters.ageMax = Math.max(+fMin.value, +fMax.value);
  S.filters.genders = gChips.length ? [...gChips] : [...GENDERS];
  S.filters.shared = document.getElementById("f-shared").checked;
  save(); toast("Filters applied ✅"); go("swipe");
});
document.getElementById("f-reset").addEventListener("click", () => {
  if (!confirm("Reset all swipes, matches, chats and your profile?")) return;
  localStorage.removeItem("stallionswipe");
  location.reload();
});
document.getElementById("f-sound").addEventListener("change", e => setSound(e.target.checked));

// ---- nav + keyboard ----
document.querySelectorAll("#nav button[data-go]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.go === "filters") refreshFilterUI();
  go(b.dataset.go);
}));
document.getElementById("like-btn").addEventListener("click", () => doSwipe(true, false));
document.getElementById("nope-btn").addEventListener("click", () => doSwipe(false, false));
document.getElementById("rewind-btn").addEventListener("click", rewind);
document.addEventListener("keydown", e => {
  if (!document.getElementById("screen-swipe").classList.contains("active")) return;
  if (e.key === "ArrowRight") doSwipe(true, false);
  if (e.key === "ArrowLeft") doSwipe(false, false);
});

// ---- boot ----
try {
  updateBadge();
  if (S.profile) { document.getElementById("nav").style.display = "flex"; go("swipe"); }
} catch (e) {
  // corrupt/stale saved state from an older version -> self-heal to a clean start
  console.warn("boot failed, clearing saved state", e);
  localStorage.removeItem("stallionswipe");
  S = DEFAULT_STATE();
  seedAdmirers();
  document.getElementById("nav").style.display = "none";
  go("onboard");
}
